name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # reserve: a tag created by hand also publishes

permissions:
  contents: write   # CI creates the tag and the Release

env:
  # ── Project ──
  APP_NAME: Intruphon
  APP_SLUG: intruphon
  # ── Stack (Android, Gradle without wrapper: setup-gradle pins 8.9) ──
  VERSION_CMD: grep -m1 -oP 'versionName\s*=?\s*"\K[^"]+' app/build.gradle.kts
  TEST_CMD: gradle testDebugUnitTest assembleRelease   # release = R8 + signing
  TEST_ARTIFACTS: app/build/outputs/apk/release/*.apk
  RELEASE_CMD: gradle assembleRelease
  ARTIFACTS: |
    app/build/outputs/apk/release/*.apk
  # ── Signing ──
  REQUIRE_SIGNING: 'true'   # without the secrets, release is blocked
  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Signing (skipped if there are no secrets)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      - run: eval "$TEST_CMD"
      - name: Name inspection build   # intruphon_v0.1.0-build12.apk
        id: n
        run: |
          N="${APP_SLUG}_v$(eval "$VERSION_CMD")-build${GITHUB_RUN_NUMBER}"; mkdir -p out
          for f in $TEST_ARTIFACTS; do
            [ -f "$f" ] || continue; b="$(basename "$f")"
            case "$b" in *.tar.gz) e=.tar.gz;; *.*) e=".${b##*.}";; *) e=;; esac
            [ ! -e "out/$N$e" ] || { echo "Two artifacts with extension '$e': adjust TEST_ARTIFACTS"; exit 1; }
            cp "$f" "out/$N$e"
          done
          echo "name=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.n.outputs.name }}
          path: out/*
          if-no-files-found: ignore

  release:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Decide whether to publish
        id: v
        run: |
          V="$(eval "$VERSION_CMD")"
          [ -n "$V" ] || { echo "VERSION_CMD returned nothing"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || { echo "Tag $GITHUB_REF_NAME differs from version $V"; exit 1; }
          elif git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "v$V already published: nothing to do."; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::v$V has no CHANGELOG section: nothing published."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.v.outputs.publish == 'true'
        with: { distribution: temurin, java-version: '17' }

      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.publish == 'true'
        with: { gradle-version: '8.9' }

      - name: Signing
        if: steps.v.outputs.publish == 'true'
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            [ "$REQUIRE_SIGNING" = true ] && { echo "Signing secrets missing: release blocked."; exit 1; }
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build and public names   # intruphon_v0.1.0.apk
        if: steps.v.outputs.publish == 'true'
        run: |
          eval "$RELEASE_CMD"
          N="${APP_SLUG}_v${{ steps.v.outputs.version }}"; mkdir -p out
          for f in $ARTIFACTS; do
            [ -f "$f" ] || continue; b="$(basename "$f")"
            case "$b" in *.tar.gz) e=.tar.gz;; *.*) e=".${b##*.}";; *) e=;; esac
            [ ! -e "out/$N$e" ] || { echo "Two artifacts with extension '$e': adjust ARTIFACTS"; exit 1; }
            cp "$f" "out/$N$e"
          done

      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ env.APP_NAME }} v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: out/*
