name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # reserve: a tag created by hand also publishes

permissions:
  contents: write   # CI creates the tag and the Release

env:
  # ── Project ──
  APP_NAME: Intruphon
  APP_SLUG: intruphon
  # ── Stack (Android; the Gradle version comes from gradle/wrapper/gradle-wrapper.properties) ──
  VERSION_CMD: grep -m1 '^APP_VERSION=' gradle.properties | cut -d= -f2
  TEST_CMD: ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace   # release = R8 + signing
  TEST_ARTIFACTS: app/build/outputs/apk/release/*.apk
  RELEASE_CMD: ./gradlew assembleRelease --no-daemon --stacktrace
  ARTIFACTS: |
    app/build/outputs/apk/release/*.apk
  # ── Signing ──
  REQUIRE_SIGNING: 'true'   # without the secrets, release is blocked
  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }   # runs Gradle; the app still compiles for 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Signing (skipped if there are no secrets)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
      # The output goes to build.log: the Actions logs are not readable from the AI session,
      # so if the build fails the next step posts the error summary as a commit comment.
      - name: Tests + release build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew 2>/dev/null || true
          eval "$TEST_CMD" 2>&1 | tee build.log
      - name: Post the error on the commit (only if it fails)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### Build failed (run ${{ github.run_id }})"
            echo
            echo "**Errors found:**"
            echo '```'
            grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -n 120 || true
            echo '```'
            echo
            echo "**End of the log:**"
            echo '```'
            tail -n 80 build.log || true
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md
      - name: Name inspection build   # intruphon_v0.1.0-build12.apk
        id: n
        run: |
          N="${APP_SLUG}_v$(eval "$VERSION_CMD")-build${GITHUB_RUN_NUMBER}"; mkdir -p out
          for f in $TEST_ARTIFACTS; do
            [ -f "$f" ] || continue; b="$(basename "$f")"
            case "$b" in *.tar.gz) e=.tar.gz;; *.*) e=".${b##*.}";; *) e=;; esac
            [ ! -e "out/$N$e" ] || { echo "Two artifacts with extension '$e': adjust TEST_ARTIFACTS"; exit 1; }
            cp "$f" "out/$N$e"
          done
          echo "name=$N" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.n.outputs.name }}
          path: out/*
          if-no-files-found: error   # a green build with no file to inspect is an error

  release:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: release
    steps:
      - uses: actions/checkout@v6

      - name: Decide whether to publish
        id: v
        run: |
          V="$(eval "$VERSION_CMD")"
          [ -n "$V" ] || { echo "VERSION_CMD returned nothing"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$V" ] || { echo "Tag $GITHUB_REF_NAME differs from version $V"; exit 1; }
          elif git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "v$V already published: nothing to do."; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # literal comparison ("1.2.0" does not match "1x2y0"); stops at the next "## ["
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            [ "$GITHUB_REF_TYPE" = tag ] && { echo "v$V is not in the CHANGELOG"; exit 1; }
            echo "::warning::v$V has no CHANGELOG section: nothing published."
            echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.v.outputs.publish == 'true'
        with: { distribution: temurin, java-version: '21' }   # runs Gradle; the app still compiles for 17

      - uses: gradle/actions/setup-gradle@v6
        if: steps.v.outputs.publish == 'true'

      - name: Signing
        if: steps.v.outputs.publish == 'true'
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            [ "$REQUIRE_SIGNING" = true ] && { echo "Signing secrets missing: release blocked."; exit 1; }
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build and public names   # intruphon_v0.1.0.apk
        if: steps.v.outputs.publish == 'true'
        run: |
          chmod +x gradlew 2>/dev/null || true
          eval "$RELEASE_CMD"
          N="${APP_SLUG}_v${{ steps.v.outputs.version }}"; mkdir -p out
          for f in $ARTIFACTS; do
            [ -f "$f" ] || continue; b="$(basename "$f")"
            case "$b" in *.tar.gz) e=.tar.gz;; *.*) e=".${b##*.}";; *) e=;; esac
            [ ! -e "out/$N$e" ] || { echo "Two artifacts with extension '$e': adjust ARTIFACTS"; exit 1; }
            cp "$f" "out/$N$e"
          done

      - uses: softprops/action-gh-release@v3
        if: steps.v.outputs.publish == 'true'
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: ${{ env.APP_NAME }} v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: out/*
